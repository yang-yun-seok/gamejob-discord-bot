name: Gamejob Discord Bot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gamejob-discord-bot.yml"
      - "main.py"
      - "requirements.txt"

  schedule:
    # GitHub may delay or drop scheduled events. Give it four chances per hour;
    # the successful-run guard below still limits actual scraping to once an hour.
    - cron: "10,25,40,55 * * * *"

  workflow_dispatch:

concurrency:
  group: gamejob-discord-bot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Restore last successful scraper marker
        uses: actions/cache/restore@v5
        with:
          path: .github/.gamejob-runtime
          key: gamejob-last-success-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gamejob-last-success-${{ github.ref_name }}-

      - name: Decide whether scraper is due
        id: due
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_GUARD_FILE: .github/.gamejob-runtime/last-success-epoch
          MIN_RUN_INTERVAL_SECONDS: "3000"
        run: |
          should_run=true
          reason="non-scheduled event"

          if [ "$EVENT_NAME" = "schedule" ] && [ -f "$RUN_GUARD_FILE" ]; then
            last_success_epoch="$(tr -d '[:space:]' < "$RUN_GUARD_FILE")"

            if [[ "$last_success_epoch" =~ ^[0-9]+$ ]]; then
              now_epoch="$(date -u +%s)"
              elapsed_seconds=$((now_epoch - last_success_epoch))
              reason="last successful scrape was ${elapsed_seconds}s ago"

              if [ "$elapsed_seconds" -lt "$MIN_RUN_INTERVAL_SECONDS" ]; then
                should_run=false
              fi
            else
              reason="cached marker was invalid"
            fi
          elif [ "$EVENT_NAME" = "schedule" ]; then
            reason="no successful-run marker was found"
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Scraper due: $should_run ($reason)."

      - name: Set up Python
        if: steps.due.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.due.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run scraper
        if: steps.due.outputs.should_run == 'true'
        id: scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GAMEJOB_TARGET_URL: ${{ vars.GAMEJOB_TARGET_URL }}
          SEED_ONLY_ON_FIRST_RUN: ${{ vars.SEED_ONLY_ON_FIRST_RUN || 'false' }}
          STATE_FILE: sent_jobs.txt
          STATE_LIMIT: ${{ vars.STATE_LIMIT || '500' }}
          REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '40' }}
          DISCORD_MAX_RETRIES: ${{ vars.DISCORD_MAX_RETRIES || '3' }}
          DETAIL_TIMEOUT_SECONDS: ${{ vars.DETAIL_TIMEOUT_SECONDS || '10' }}
          DETAIL_FAILURE_LIMIT: ${{ vars.DETAIL_FAILURE_LIMIT || '3' }}
          SCRAPER_MAX_ATTEMPTS: ${{ vars.SCRAPER_MAX_ATTEMPTS || '3' }}
          SCRAPER_RETRY_DELAY_SECONDS: ${{ vars.SCRAPER_RETRY_DELAY_SECONDS || '60' }}
          PYTHONUNBUFFERED: "1"
        run: |
          attempt=1

          while [ "$attempt" -le "$SCRAPER_MAX_ATTEMPTS" ]; do
            echo "Starting scraper attempt $attempt/$SCRAPER_MAX_ATTEMPTS."

            if python -u main.py; then
              exit 0
            fi

            if [ "$attempt" -eq "$SCRAPER_MAX_ATTEMPTS" ]; then
              echo "::error::Scraper failed after $SCRAPER_MAX_ATTEMPTS attempts."
              exit 1
            fi

            echo "::warning::Scraper attempt $attempt failed. Retrying in $SCRAPER_RETRY_DELAY_SECONDS seconds."
            sleep "$SCRAPER_RETRY_DELAY_SECONDS"
            attempt=$((attempt + 1))
          done

      - name: Commit state file
        if: ${{ steps.due.outputs.should_run == 'true' && always() }}
        env:
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f sent_jobs.txt ]; then
            echo "sent_jobs.txt does not exist. Skipping commit."
            exit 0
          fi

          git add sent_jobs.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update sent jobs state"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin HEAD:"$BRANCH_NAME"

      - name: Record successful scraper time
        if: ${{ steps.due.outputs.should_run == 'true' && success() }}
        shell: bash
        env:
          RUN_GUARD_FILE: .github/.gamejob-runtime/last-success-epoch
        run: |
          mkdir -p "$(dirname "$RUN_GUARD_FILE")"
          date -u +%s > "$RUN_GUARD_FILE"

      - name: Save last successful scraper marker
        if: ${{ steps.due.outputs.should_run == 'true' && success() }}
        uses: actions/cache/save@v5
        with:
          path: .github/.gamejob-runtime
          key: gamejob-last-success-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
