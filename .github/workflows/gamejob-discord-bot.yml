name: Gamejob Discord Bot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gamejob-discord-bot.yml"
      - "main.py"
      - "requirements.txt"

  schedule:
    # Avoid the top of the hour, when scheduled Actions runs are most delayed.
    - cron: "17 * * * *"

  workflow_dispatch:

concurrency:
  group: gamejob-discord-bot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper
        id: scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GAMEJOB_TARGET_URL: ${{ vars.GAMEJOB_TARGET_URL }}
          SEED_ONLY_ON_FIRST_RUN: ${{ vars.SEED_ONLY_ON_FIRST_RUN || 'false' }}
          STATE_FILE: sent_jobs.txt
          STATE_LIMIT: ${{ vars.STATE_LIMIT || '500' }}
          REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '40' }}
          DISCORD_MAX_RETRIES: ${{ vars.DISCORD_MAX_RETRIES || '3' }}
          SCRAPER_MAX_ATTEMPTS: ${{ vars.SCRAPER_MAX_ATTEMPTS || '3' }}
          SCRAPER_RETRY_DELAY_SECONDS: ${{ vars.SCRAPER_RETRY_DELAY_SECONDS || '60' }}
          PYTHONUNBUFFERED: "1"
        run: |
          attempt=1

          while [ "$attempt" -le "$SCRAPER_MAX_ATTEMPTS" ]; do
            echo "Starting scraper attempt $attempt/$SCRAPER_MAX_ATTEMPTS."

            if python -u main.py; then
              exit 0
            fi

            if [ "$attempt" -eq "$SCRAPER_MAX_ATTEMPTS" ]; then
              echo "::error::Scraper failed after $SCRAPER_MAX_ATTEMPTS attempts."
              exit 1
            fi

            echo "::warning::Scraper attempt $attempt failed. Retrying in $SCRAPER_RETRY_DELAY_SECONDS seconds."
            sleep "$SCRAPER_RETRY_DELAY_SECONDS"
            attempt=$((attempt + 1))
          done

      - name: Commit state file
        if: always()
        env:
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f sent_jobs.txt ]; then
            echo "sent_jobs.txt does not exist. Skipping commit."
            exit 0
          fi

          git add sent_jobs.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update sent jobs state"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin HEAD:"$BRANCH_NAME"
